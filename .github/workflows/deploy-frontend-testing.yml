name: Deploy Testing Frontend

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies & Compile Build
        run: |
          npm ci
          npm run build

      - name: Deploy Compiled dist Folder to Server via Sync
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # CHANGED: Target the specific nested build files inside your app output
          source: "dist/client/*,dist/client/**"
          target: "public_html/frontend-staging"
          # CHANGED: Strips both the 'dist/' and 'client/' folders so files land directly
          strip_components: 2
          overwrite: true
