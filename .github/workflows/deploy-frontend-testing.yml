name: Deploy Testing Frontend

on:
  push:
    branches:
      - staging  # Triggers when you push to your frontend staging branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24  # Matches your local node version (e.g., 24)
          cache: 'npm'

      - name: Install Dependencies & Compile Build
        run: |
          npm ci        # Installs clean lockfile dependencies safely
          npm run build # Compiles your project and creates the clean 'dist' folder

      - name: Deploy Compiled 'dist' Folder to Server via Sync
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist/*" # TARGET ONLY THE CLEAN BUILD COMPONENT
          target: "/home/sabbarapost/public_html/frontend-staging"
          strip_components: 1 # Strips the "dist/" folder name so files sit directly in the target
          overwrite: true
i
